<!DOCTYPE html>
<html lang="en">

<!-- ============================================================================
     SECRET MATRIX PAGE - Audio Design Studios
     Easter egg page with full-screen falling matrix animation
     ============================================================================ -->

<head>
  <!-- Meta Information -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Matrix - Audio Design Studios</title>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="matrix.css?v=1768334640" />
</head>

<body>
  <!-- Full-screen clickable link -->
  <a href="index.html" class="fullscreen-link"></a>
  
  <!-- Full-screen Matrix Animation -->
  <div class="matrix-fullscreen" id="matrixFullscreen"></div>

  <!-- Matrix Animation Script -->
  <script>
    const terminal = document.getElementById('matrixFullscreen');
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    terminal.appendChild(canvas);
    
    const chars = '♩♪♫♬♭♮♯';
    let columns, drops, xPositions;
    
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      canvas.style.display = 'block';
      const fontSize = 18;
      const columnWidth = 15;
      columns = Math.floor(canvas.width / columnWidth);
      const totalWidth = columns * columnWidth;
      const offsetX = (canvas.width - totalWidth) / 2;
      drops = Array(columns).fill(0).map(() => Math.random() * -20);
      xPositions = Array(columns).fill(0).map((_, i) => offsetX + i * columnWidth + columnWidth / 2);
    }
    
    function draw() {
      ctx.fillStyle = 'rgba(20, 20, 20, 0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.font = 'bold 18px Courier New';
      ctx.fillStyle = '#08ce18';
      
      for (let i = 0; i < drops.length; i++) {
        const char = chars[Math.floor(Math.random() * chars.length)];
        const x = xPositions[i];
        const y = drops[i] * 35;
        
        ctx.fillText(char, x, y);
        
        if (y > canvas.height && Math.random() > 0.95) {
        drops[i] = 0;
        const columnWidth = 15;
        const totalWidth = columns * columnWidth;
        const offsetX = (canvas.width - totalWidth) / 2;
        xPositions[i] = offsetX + i * columnWidth + columnWidth / 2 + Math.random() * 8 - 4;
        }
        drops[i] += 0.42;
      }
    }
    
    resize();
    window.addEventListener('resize', resize);
    setInterval(draw, 90);
  </script>
</body>
</html>
